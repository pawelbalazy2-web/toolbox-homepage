<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rzut monetą online — orzeł czy reszka</title>
<meta name="description" content="Wirtualny rzut monetą online. Orzeł czy reszka? Sprawdź statystyki serii rzutów.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9406337676828505" crossorigin="anonymous"></script>
<style>
  :root{ --ink:#1a1633; --surface:#241f42; --line:#372f5e; --paper:#f2eefc; --muted:#a99fd4; --pink:#ff3f8e; --teal:#35d0ba; --yellow:#ffd93d; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 20px 40px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--pink); margin-bottom:14px; }
  h1{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(30px,4.8vw,44px); text-align:center; max-width:600px; margin:0 0 12px; }
  .sub{ color:var(--muted); text-align:center; max-width:420px; font-size:15px; margin:0 0 32px; }
  .coin{ width:150px; height:150px; border-radius:50%; background:linear-gradient(135deg,var(--yellow),#e0a458); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:20px; color:var(--ink); margin-bottom:26px; box-shadow:0 8px 24px rgba(0,0,0,0.3); transition:transform .4s ease; }
  .coin.flipping{ animation:flip 0.6s ease; }
  @keyframes flip{ 0%{transform:rotateY(0);} 50%{transform:rotateY(720deg) scale(1.1);} 100%{transform:rotateY(1080deg);} }
  .flip-btn{ background:var(--pink); color:#fff; border:none; font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; padding:14px 32px; border-radius:26px; cursor:pointer; }
  .flip-btn:hover{ background:#e8317c; }
  .stats{ display:flex; gap:30px; margin-top:26px; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted); }
  .stats b{ display:block; font-size:22px; color:var(--paper); }
  footer{ margin-top:56px; color:#4d4478; font-size:12px; font-family:'IBM Plex Mono',monospace; text-align:center; }
  footer a{ color:#4d4478; }
</style>
</head>
<body>
  <div class="eyebrow">gra / losowanie</div>
  <h1>Orzeł czy reszka?</h1>
  <p class="sub">Wirtualny rzut monetą z historią wyników.</p>

  <div class="coin" id="coin">Kliknij</div>
  <button class="flip-btn" id="flipBtn">Rzuć monetą</button>

  <div class="stats">
    <div>ORZEŁ<b id="headsCount">0</b></div>
    <div>RESZKA<b id="tailsCount">0</b></div>
    <div>RAZEM<b id="totalCount">0</b></div>
  </div>

  <footer>toolbox-pl &nbsp;·&nbsp; <a href="/polityka-prywatnosci.html">polityka prywatności</a> &nbsp;·&nbsp; <a href="/regulamin.html">regulamin</a></footer>

<script>
  let heads = 0, tails = 0;
  const coin = document.getElementById('coin');

  document.getElementById('flipBtn').addEventListener('click', () => {
    coin.classList.remove('flipping');
    void coin.offsetWidth;
    coin.classList.add('flipping');

    setTimeout(() => {
      const result = Math.random() < 0.5 ? 'ORZEŁ' : 'RESZKA';
      coin.textContent = result;
      if(result === 'ORZEŁ') heads++; else tails++;
      document.getElementById('headsCount').textContent = heads;
      document.getElementById('tailsCount').textContent = tails;
      document.getElementById('totalCount').textContent = heads + tails;
    }, 500);
  });
</script>
</body>
</html>
